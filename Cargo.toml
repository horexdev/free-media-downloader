[workspace]
members = [
    "crates/fmd-core",
    "crates/fmd-curl-worker",
    "crates/fmd-launcher",
    "crates/fmd-packager",
    "crates/fmd-updater",
    "src-tauri",
]
default-members = ["crates/fmd-core", "crates/fmd-updater", "crates/fmd-curl-worker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
authors = ["FMD contributors"]
repository = "https://github.com/horexdev/free-media-downloader"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
directories = "6.0.0"
fs2 = "0.4.3"
futures-util = "0.3.33"
libc = "0.2.180"
parking_lot = "0.12.5"
quick-xml = "0.41.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tough = { version = "0.24.0", features = ["http"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl"] }
url = { version = "2.5.8", features = ["serde"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
sha2 = "0.10.9"
subtle = "2.6.1"
tokio-util = { version = "0.7.18", features = ["rt"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
zeroize = { version = "1.8.2", features = ["derive"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate", "deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.release.package.fmd-updater]
opt-level = "z"

[profile.release.package.fmd-launcher]
opt-level = "z"

[profile.release.package.fmd-curl-worker]
opt-level = "z"
