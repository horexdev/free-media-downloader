name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for manual run)"
        required: false
        type: string
      prerelease:
        description: "Must remain enabled for unsigned beta releases"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: "nsis"
          - id: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: "nsis"
          - id: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: "dmg,app"
          - id: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: "dmg,app"
          - id: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: "appimage,deb"
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: "appimage,deb"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Ensure rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - run: rustup target add ${{ matrix.target }}
      - name: Build portable launcher
        run: cargo build --locked --release -p fmd-launcher --target ${{ matrix.target }} --target-dir src-tauri/target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgdk-pixbuf2.0-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --config src-tauri/tauri.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - run: node scripts/package-core-artifacts.mjs --target "${{ matrix.id }}" --workspace "${{ github.workspace }}" --out "${{ runner.temp }}/core-artifacts"
      - name: Smoke portable and installed distributions
        run: node scripts/smoke-core-artifacts.mjs --target "${{ matrix.id }}" --artifacts "${{ runner.temp }}/core-artifacts"
      - name: Verify packed outputs
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.id }}"
          expected=("${{ runner.temp }}/core-artifacts/FMD-${TARGET}-portable.zip" "${{ runner.temp }}/core-artifacts/FMD-${TARGET}-update.zip" "${{ runner.temp }}/core-artifacts/FMD-${TARGET}-setup.exe")
          if [[ "$TARGET" == macos-* ]]; then
            expected=("${{ runner.temp }}/core-artifacts/FMD-${{ matrix.id }}.app.zip" "${{ runner.temp }}/core-artifacts/FMD-${{ matrix.id }}.dmg")
          elif [[ "$TARGET" == linux-* ]]; then
            expected=("${{ runner.temp }}/core-artifacts/FMD-${{ matrix.id }}.AppImage" "${{ runner.temp }}/core-artifacts/FMD-${{ matrix.id }}.deb")
          fi

          for f in "${expected[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "missing artifact: $f"
              exit 1
            fi
          done

          for f in "${expected[@]}"; do
            echo " - $(basename "$f")"
          done
      - name: Upload core artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-${{ matrix.id }}
          path: ${{ runner.temp }}/core-artifacts
          if-no-files-found: error
          retention-days: 14

  build-engines:
    uses: ./.github/workflows/engine-packs.yml
    with:
      run_packs: true

  release:
    needs: [build-core, build-engines]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Determine tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ github.event.inputs.tag }}" ]]; then
            echo "Manual release requires a tag input"
            exit 1
          fi

          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "release tag $TAG does not match package version v$VERSION"
            exit 1
          fi
          if [[ "$VERSION" != *-* ]]; then
            echo "unsigned release workflow only accepts prerelease versions"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.prerelease }}" != "true" ]]; then
            echo "unsigned beta releases must be published as prereleases"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download all core artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/core
          pattern: core-*
          merge-multiple: true
      - name: Download all engine pack artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/engines
          pattern: unsigned-*
          merge-multiple: true
      - name: Normalize release assets
        run: |
          find artifacts -type f -maxdepth 3 | sort
          mkdir -p artifacts/release
          find artifacts -maxdepth 3 -type f -print0 | xargs -0 -I{} mv {} artifacts/release/
          find artifacts/release -type f | sort
      - name: Add SHA256 checksums
        run: |
          cd artifacts/release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Require update publication configuration
        env:
          APP_CLIENT_ID: ${{ secrets.FMD_UPDATES_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FMD_UPDATES_APP_PRIVATE_KEY }}
          CORE_ROOT_SHA256: ${{ vars.FMD_CORE_TUF_ROOT_SHA256 }}
          ENGINES_ROOT_SHA256: ${{ vars.FMD_ENGINES_TUF_ROOT_SHA256 }}
          CORE_TARGETS_KEY: ${{ secrets.FMD_CORE_TUF_TARGETS_KEY }}
          CORE_SNAPSHOT_KEY: ${{ secrets.FMD_CORE_TUF_SNAPSHOT_KEY }}
          CORE_TIMESTAMP_KEY: ${{ secrets.FMD_CORE_TUF_TIMESTAMP_KEY }}
          ENGINES_TARGETS_KEY: ${{ secrets.FMD_ENGINES_TUF_TARGETS_KEY }}
          ENGINES_SNAPSHOT_KEY: ${{ secrets.FMD_ENGINES_TUF_SNAPSHOT_KEY }}
          ENGINES_TIMESTAMP_KEY: ${{ secrets.FMD_ENGINES_TUF_TIMESTAMP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for value in APP_CLIENT_ID APP_PRIVATE_KEY CORE_ROOT_SHA256 ENGINES_ROOT_SHA256 CORE_TARGETS_KEY CORE_SNAPSHOT_KEY CORE_TIMESTAMP_KEY ENGINES_TARGETS_KEY ENGINES_SNAPSHOT_KEY ENGINES_TIMESTAMP_KEY; do
            if [[ -z "${!value}" ]]; then
              echo "required release configuration is missing: $value"
              exit 1
            fi
          done
          core_actual="$(sha256sum src-tauri/resources/tuf/core-root.json | cut -d' ' -f1)"
          engines_actual="$(sha256sum src-tauri/resources/tuf/engines-root.json | cut -d' ' -f1)"
          [[ "$core_actual" == "$CORE_ROOT_SHA256" ]] || { echo "core root fingerprint mismatch"; exit 1; }
          [[ "$engines_actual" == "$ENGINES_ROOT_SHA256" ]] || { echo "engines root fingerprint mismatch"; exit 1; }
          [[ "$core_actual" != "$engines_actual" ]] || { echo "core and engines roots must differ"; exit 1; }
      - name: Draft release notes
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          cat > release-notes.md <<EOF
          # Free Media Downloader release ${TAG}

          This release is unsigned at the application/engine distribution layer.
          Windows/macOS users may see platform trust prompts; use the release files directly.

          Core and engine updates are authenticated by separate TUF trust roots. Automatic core
          replacement is available only for Windows portable, self-managed macOS app bundles, and
          Linux AppImage installations. NSIS and DEB installations receive a manual update notice.

          ## Artifacts

          - Core application builds for all 6 targets
          - Unsigned engine packs (`video-core`, `live-streams`, `galleries`, `general-downloads`, `ffmpeg-standard`)
          - SHA256SUMS
          EOF
      - name: Create unsigned prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=()
          for f in artifacts/release/*; do
            assets+=("$f")
          done
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No assets to upload"
            exit 1
          fi
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "Free Media Downloader ${{ steps.release_tag.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --prerelease \
            --draft \
            --notes-file release-notes.md \
            "${assets[@]}"
      - name: Create updates-repository token
        id: updates_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.FMD_UPDATES_APP_CLIENT_ID }}
          private-key: ${{ secrets.FMD_UPDATES_APP_PRIVATE_KEY }}
          owner: horexdev
          repositories: free-media-downloader-updates
          permission-contents: write
      - name: Checkout updates repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: horexdev/free-media-downloader-updates
          token: ${{ steps.updates_token.outputs.token }}
          path: updates-repo
      - name: Verify trusted root fingerprints and signing configuration
        env:
          CORE_ROOT_SHA256: ${{ vars.FMD_CORE_TUF_ROOT_SHA256 }}
          ENGINES_ROOT_SHA256: ${{ vars.FMD_ENGINES_TUF_ROOT_SHA256 }}
          CORE_TARGETS_KEY: ${{ secrets.FMD_CORE_TUF_TARGETS_KEY }}
          CORE_SNAPSHOT_KEY: ${{ secrets.FMD_CORE_TUF_SNAPSHOT_KEY }}
          CORE_TIMESTAMP_KEY: ${{ secrets.FMD_CORE_TUF_TIMESTAMP_KEY }}
          ENGINES_TARGETS_KEY: ${{ secrets.FMD_ENGINES_TUF_TARGETS_KEY }}
          ENGINES_SNAPSHOT_KEY: ${{ secrets.FMD_ENGINES_TUF_SNAPSHOT_KEY }}
          ENGINES_TIMESTAMP_KEY: ${{ secrets.FMD_ENGINES_TUF_TIMESTAMP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for value in CORE_ROOT_SHA256 ENGINES_ROOT_SHA256 CORE_TARGETS_KEY CORE_SNAPSHOT_KEY CORE_TIMESTAMP_KEY ENGINES_TARGETS_KEY ENGINES_SNAPSHOT_KEY ENGINES_TIMESTAMP_KEY; do
            if [[ -z "${!value}" ]]; then
              echo "required release configuration is missing: $value"
              exit 1
            fi
          done
          core_actual="$(sha256sum src-tauri/resources/tuf/core-root.json | cut -d' ' -f1)"
          engines_actual="$(sha256sum src-tauri/resources/tuf/engines-root.json | cut -d' ' -f1)"
          [[ "$core_actual" == "$CORE_ROOT_SHA256" ]] || { echo "core root fingerprint mismatch"; exit 1; }
          [[ "$engines_actual" == "$ENGINES_ROOT_SHA256" ]] || { echo "engines root fingerprint mismatch"; exit 1; }
          [[ "$core_actual" != "$engines_actual" ]] || { echo "core and engines roots must differ"; exit 1; }
          install -m 0700 -d "${RUNNER_TEMP}/tuf-keys/core" "${RUNNER_TEMP}/tuf-keys/engines"
          printf '%s' "$CORE_TARGETS_KEY" > "${RUNNER_TEMP}/tuf-keys/core/targets.pem"
          printf '%s' "$CORE_SNAPSHOT_KEY" > "${RUNNER_TEMP}/tuf-keys/core/snapshot.pem"
          printf '%s' "$CORE_TIMESTAMP_KEY" > "${RUNNER_TEMP}/tuf-keys/core/timestamp.pem"
          printf '%s' "$ENGINES_TARGETS_KEY" > "${RUNNER_TEMP}/tuf-keys/engines/targets.pem"
          printf '%s' "$ENGINES_SNAPSHOT_KEY" > "${RUNNER_TEMP}/tuf-keys/engines/snapshot.pem"
          printf '%s' "$ENGINES_TIMESTAMP_KEY" > "${RUNNER_TEMP}/tuf-keys/engines/timestamp.pem"
          chmod 0600 "${RUNNER_TEMP}"/tuf-keys/*/*.pem
      - name: Generate signed TUF feeds
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/${{ github.repository }}/releases/download/${{ steps.release_tag.outputs.tag }}"
          node scripts/tuf/publish-feed.mjs \
            --feed core \
            --root src-tauri/resources/tuf/core-root.json \
            --assets artifacts/release \
            --out updates-repo \
            --release-base-url "$release_url" \
            --release-version "${{ steps.release_tag.outputs.version }}" \
            --targets-key "${RUNNER_TEMP}/tuf-keys/core/targets.pem" \
            --snapshot-key "${RUNNER_TEMP}/tuf-keys/core/snapshot.pem" \
            --timestamp-key "${RUNNER_TEMP}/tuf-keys/core/timestamp.pem"
          node scripts/tuf/publish-feed.mjs \
            --feed engines \
            --root src-tauri/resources/tuf/engines-root.json \
            --assets artifacts/release \
            --out updates-repo \
            --release-base-url "$release_url" \
            --release-version "${{ steps.release_tag.outputs.version }}" \
            --targets-key "${RUNNER_TEMP}/tuf-keys/engines/targets.pem" \
            --snapshot-key "${RUNNER_TEMP}/tuf-keys/engines/snapshot.pem" \
            --timestamp-key "${RUNNER_TEMP}/tuf-keys/engines/timestamp.pem"
          node scripts/tuf/verify-published-feed.mjs updates-repo/core
          node scripts/tuf/verify-published-feed.mjs updates-repo/engines
      - name: Publish TUF metadata and descriptors
        working-directory: updates-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FMD Release Publisher"
          git config user.email "release-publisher@users.noreply.github.com"
          git add core engines
          git diff --cached --exit-code && { echo "TUF publication produced no changes"; exit 1; }
          git commit -m "chore: publish ${{ steps.release_tag.outputs.tag }} update feeds"
          git push origin HEAD:main
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${{ steps.release_tag.outputs.tag }}"
          --repo "${{ github.repository }}"
          --draft=false
          --prerelease
      - name: Post-publication Pages smoke test
        shell: bash
        run: |
          node scripts/tuf/verify-remote-feed.mjs \
            --base-url https://horexdev.github.io/free-media-downloader-updates/core \
            --expected-timestamp updates-repo/core/metadata/timestamp.json
          node scripts/tuf/verify-remote-feed.mjs \
            --base-url https://horexdev.github.io/free-media-downloader-updates/engines \
            --expected-timestamp updates-repo/engines/metadata/timestamp.json
