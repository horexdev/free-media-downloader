name: Engine packs

on:
  workflow_call:
    inputs:
      run_packs:
        description: Run the native engine-pack build matrix
        required: false
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg-source:
    if: github.event_name == 'workflow_dispatch' || inputs.run_packs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify signed FFmpeg source
        run: >-
          node scripts/packs/verify-ffmpeg-source.mjs
          --work "${{ runner.temp }}/ffmpeg-source"
          --gpg gpg
      - name: Verify signed OpenSSL source
        run: >-
          node scripts/packs/verify-ffmpeg-source.mjs
          --component openssl
          --work "${{ runner.temp }}/openssl-source"
          --gpg gpg

  ffmpeg-unix:
    if: github.event_name == 'workflow_dispatch' || inputs.run_packs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify signed FFmpeg source
        run: >-
          node scripts/packs/verify-ffmpeg-source.mjs
          --work "${{ runner.temp }}/ffmpeg-input"
          --gpg gpg
      - name: Verify signed OpenSSL source
        if: startsWith(matrix.target, 'linux-')
        run: >-
          node scripts/packs/verify-ffmpeg-source.mjs
          --component openssl
          --work "${{ runner.temp }}/openssl-input"
          --gpg gpg
      - name: Install Linux x64 assembler
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
          nasm -v
      - name: Install macOS x64 assembler
        if: matrix.target == 'macos-x64'
        run: |
          command -v nasm >/dev/null || brew install nasm
          nasm -v
      - name: Build Linux binaries
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        env:
          FMD_BUILD_JOBS: "2"
        run: >-
          bash scripts/packs/build-ffmpeg-standard.sh
          "${{ matrix.target }}"
          "${{ runner.temp }}/ffmpeg-input/ffmpeg-9.0.tar.xz"
          "${{ runner.temp }}/ffmpeg-build"
          "${{ runner.temp }}/ffmpeg-output"
          "${{ runner.temp }}/openssl-input/openssl-3.5.7.tar.gz"
      - name: Build macOS binaries
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        env:
          FMD_BUILD_JOBS: "2"
        run: >-
          bash scripts/packs/build-ffmpeg-standard.sh
          "${{ matrix.target }}"
          "${{ runner.temp }}/ffmpeg-input/ffmpeg-9.0.tar.xz"
          "${{ runner.temp }}/ffmpeg-build"
          "${{ runner.temp }}/ffmpeg-output"
      - name: Upload unsigned CI binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-ffmpeg-standard-${{ matrix.target }}
          path: ${{ runner.temp }}/ffmpeg-output/
          if-no-files-found: error
          retention-days: 7

  video-core:
    if: github.event_name == 'workflow_dispatch' || inputs.run_packs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            packager: target/release/fmd-packager.exe
            gpg: C:/Program Files/Git/usr/bin/gpg.exe
          - target: windows-arm64
            runner: windows-11-arm
            packager: target/release/fmd-packager.exe
            gpg: C:/Program Files/Git/usr/bin/gpg.exe
          - target: macos-x64
            runner: macos-15-intel
            packager: target/release/fmd-packager
            gpg: gpg
          - target: macos-arm64
            runner: macos-15
            packager: target/release/fmd-packager
            gpg: gpg
          - target: linux-x64
            runner: ubuntu-24.04
            packager: target/release/fmd-packager
            gpg: gpg
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            packager: target/release/fmd-packager
            gpg: gpg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Require signature verifier
        shell: pwsh
        run: '& "${{ matrix.gpg }}" --version'
      - name: Build packager
        run: cargo build --locked --release -p fmd-packager
      - name: Assemble and smoke-test video-core
        shell: pwsh
        run: >-
          node scripts/packs/assemble-video-core.mjs
          --target "${{ matrix.target }}"
          --work "${{ runner.temp }}/video-core-work"
          --out "${{ runner.temp }}/video-core-${{ matrix.target }}.zip"
          --packager "${{ matrix.packager }}"
          --gpg "${{ matrix.gpg }}"
      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-video-core-${{ matrix.target }}
          path: ${{ runner.temp }}/video-core-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  python-packs:
    if: github.event_name == 'workflow_dispatch' || inputs.run_packs
    strategy:
      fail-fast: false
      matrix:
        pack: [live-streams, galleries]
        target:
          - { id: windows-x64, runner: windows-2025, packager: target/release/fmd-packager.exe }
          - { id: windows-arm64, runner: windows-11-arm, packager: target/release/fmd-packager.exe }
          - { id: macos-x64, runner: macos-15-intel, packager: target/release/fmd-packager }
          - { id: macos-arm64, runner: macos-15, packager: target/release/fmd-packager }
          - { id: linux-x64, runner: ubuntu-24.04, packager: target/release/fmd-packager }
          - { id: linux-arm64, runner: ubuntu-24.04-arm, packager: target/release/fmd-packager }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packs/requirements/${{ matrix.pack }}.lock
      - name: Install hash-locked bundle dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          --only-binary=:all:
          -r packs/requirements/${{ matrix.pack }}.lock
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Build packager
        run: cargo build --locked --release -p fmd-packager
      - name: Build Streamlink one-folder bundle
        if: matrix.pack == 'live-streams'
        shell: pwsh
        run: >-
          python -m PyInstaller --clean --noconfirm --onedir
          --name streamlink
          --distpath "${{ runner.temp }}/python-dist"
          --workpath "${{ runner.temp }}/python-work"
          --specpath "${{ runner.temp }}/python-spec"
          --collect-all streamlink
          --collect-all streamlink_cli
          --copy-metadata streamlink
          scripts/packs/python-entry/streamlink_entry.py
      - name: Build gallery-dl one-folder bundle
        if: matrix.pack == 'galleries'
        shell: pwsh
        run: >-
          python -m PyInstaller --clean --noconfirm --onedir
          --name gallery_dl
          --distpath "${{ runner.temp }}/python-dist"
          --workpath "${{ runner.temp }}/python-work"
          --specpath "${{ runner.temp }}/python-spec"
          --collect-all gallery_dl
          --copy-metadata gallery-dl
          scripts/packs/python-entry/gallery_entry.py
      - name: Collect locked dependency licenses
        shell: pwsh
        run: >-
          python scripts/packs/collect-python-licenses.py
          --lock "packs/requirements/${{ matrix.pack }}.lock"
          --out "${{ runner.temp }}/python-licenses"
      - name: Assemble and smoke-test pack
        shell: pwsh
        run: >-
          node scripts/packs/assemble-python-engine-pack.mjs
          --pack "${{ matrix.pack }}"
          --target "${{ matrix.target.id }}"
          --bundle "${{ runner.temp }}/python-dist/${{ matrix.pack == 'live-streams' && 'streamlink' || 'gallery_dl' }}"
          --licenses "${{ runner.temp }}/python-licenses"
          --lock "packs/requirements/${{ matrix.pack }}.lock"
          --work "${{ runner.temp }}/${{ matrix.pack }}-assembly"
          --out "${{ runner.temp }}/${{ matrix.pack }}-${{ matrix.target.id }}.zip"
          --packager "${{ matrix.target.packager }}"
      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-${{ matrix.pack }}-${{ matrix.target.id }}
          path: ${{ runner.temp }}/${{ matrix.pack }}-${{ matrix.target.id }}.zip
          if-no-files-found: error
          retention-days: 7

  general-downloads:
    if: github.event_name == 'workflow_dispatch' || inputs.run_packs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            packager: target/release/fmd-packager.exe
            worker: target/release/fmd-curl-worker.exe
          - target: windows-arm64
            runner: windows-11-arm
            packager: target/release/fmd-packager.exe
            worker: target/release/fmd-curl-worker.exe
          - target: macos-x64
            runner: macos-15-intel
            packager: target/release/fmd-packager
            worker: target/release/fmd-curl-worker
          - target: macos-arm64
            runner: macos-15
            packager: target/release/fmd-packager
            worker: target/release/fmd-curl-worker
          - target: linux-x64
            runner: ubuntu-24.04
            packager: target/release/fmd-packager
            worker: target/release/fmd-curl-worker
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            packager: target/release/fmd-packager
            worker: target/release/fmd-curl-worker
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Prepare curl static prefix (Windows only)
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $urls = @{
            "windows-x64" = "https://curl.se/windows/dl-8.21.0_6/curl-8.21.0_6-win64-mingw.zip"
            "windows-arm64" = "https://curl.se/windows/dl-8.21.0_6/curl-8.21.0_6-win64a-mingw.zip"
          }
          $url = $urls["${{ matrix.target }}"]
          if (-not $url) {
            throw "Unsupported curl prefix target: ${{ matrix.target }}"
          }
          $archive = Join-Path "${{ runner.temp }}" "curl-static.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          $extract = Join-Path "${{ runner.temp }}" "curl-static-prefix"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $prefix = Get-ChildItem -Path $extract -Directory -ErrorAction Stop | ForEach-Object {
            if (Test-Path (Join-Path $_.FullName "include/curl/curl.h") -and Test-Path (Join-Path $_.FullName "lib/libcurl.a")) {
              $_.FullName
            }
          } | Select-Object -First 1
          if (-not $prefix) {
            $prefix = $extract
          }
          if (-not $prefix) {
            throw "curl static archive is empty: $archive"
          }
          if (-not (Test-Path (Join-Path $prefix "include/curl/curl.h")) -or
              -not (Test-Path (Join-Path $prefix "lib/libcurl.a"))) {
            throw "curl static prefix is missing required headers/libs"
          }
          echo "FMD_CURL_STATIC_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "curl static prefix: $prefix"
      - name: Prepare curl static prefix (Unix)
        if: startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          bash scripts/packs/build-curl-static-prefix.sh \
            "${{ matrix.target }}" \
            "${{ runner.temp }}/curl-static-prefix"
      - name: Install aria2 (Linux/macOS)
        if: startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-')
        run: |
          if command -v apt-get >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends aria2
          else
            command -v brew >/dev/null && brew install aria2
          fi
          ARIA2_PATH="$(command -v aria2c || true)"
          if [ -z "$ARIA2_PATH" ]; then
            echo "Failed to resolve aria2c path"
            exit 1
          fi
          echo "ARIA2_PATH=$ARIA2_PATH" >> "$GITHUB_ENV"
      - name: Install aria2 (Windows)
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $aria2 = (Get-Command aria2c -ErrorAction SilentlyContinue)?.Source
          if (-not $aria2) {
            $aria2Zip = "${{ runner.temp }}\\aria2.zip"
            $aria2Out = "${{ runner.temp }}\\aria2-extract"
            New-Item -ItemType Directory -Force -Path $aria2Out | Out-Null
            Invoke-WebRequest -Uri https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip -OutFile $aria2Zip -UseBasicParsing
            Expand-Archive -Path $aria2Zip -DestinationPath $aria2Out -Force
            $aria2 = Get-ChildItem -Path $aria2Out -Filter aria2c.exe -Recurse -ErrorAction Stop | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $aria2) {
            throw "aria2c binary was not found after install"
          }
          echo "ARIA2_PATH=$aria2" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build packager and curl worker (Windows)
        if: startsWith(matrix.target, 'windows-')
        run: cargo build --locked --release -p fmd-packager -p fmd-curl-worker --features native-stack
      - name: Build packager and curl worker (Linux/macOS)
        if: startsWith(matrix.target, 'linux-') || startsWith(matrix.target, 'macos-')
        env:
          FMD_CURL_STATIC_PREFIX: "${{ runner.temp }}/curl-static-prefix/prefix"
        run: cargo build --locked --release -p fmd-packager -p fmd-curl-worker --features native-stack
      - name: Assemble and smoke-test general-downloads
        shell: pwsh
        run: >-
          node scripts/packs/assemble-general-downloads.mjs
          --target "${{ matrix.target }}"
          --work "${{ runner.temp }}/general-downloads-work"
          --out "${{ runner.temp }}/general-downloads-${{ matrix.target }}.zip"
          --packager "${{ matrix.packager }}"
          --aria2 "${{ env.ARIA2_PATH }}"
          --worker "${{ matrix.worker }}"
          --require-sftp true
      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-general-downloads-${{ matrix.target }}
          path: ${{ runner.temp }}/general-downloads-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7

  engine-packs-required:
    if: always()
    needs: [ffmpeg-source, ffmpeg-unix, video-core, python-packs, general-downloads]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful engine-pack checks when selected
        env:
          SHOULD_RUN: ${{ github.event_name == 'workflow_dispatch' || inputs.run_packs }}
          FFMPEG_SOURCE: ${{ needs.ffmpeg-source.result }}
          FFMPEG_UNIX: ${{ needs.ffmpeg-unix.result }}
          VIDEO_CORE: ${{ needs.video-core.result }}
          PYTHON_PACKS: ${{ needs.python-packs.result }}
          GENERAL_DOWNLOADS: ${{ needs.general-downloads.result }}
        run: |
          if [[ "$SHOULD_RUN" != "true" ]]; then
            echo "Engine-pack checks are not required for these changes."
            exit 0
          fi

          for result in "$FFMPEG_SOURCE" "$FFMPEG_UNIX" "$VIDEO_CORE" "$PYTHON_PACKS" "$GENERAL_DOWNLOADS"; do
            if [[ "$result" != "success" ]]; then
              echo "A required engine-pack check finished with: $result"
              exit 1
            fi
          done
