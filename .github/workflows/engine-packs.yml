name: Engine packs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/engine-packs.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/fmd-core/**"
      - "crates/fmd-packager/**"
      - "packs/**"
      - "scripts/packs/**"
      - "scripts/validate-release-inputs.mjs"

permissions:
  contents: read

jobs:
  video-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            packager: target/release/fmd-packager.exe
            gpg: C:/Program Files/Git/usr/bin/gpg.exe
          - target: windows-arm64
            runner: windows-11-arm
            packager: target/release/fmd-packager.exe
            gpg: C:/Program Files/Git/usr/bin/gpg.exe
          - target: macos-x64
            runner: macos-15-intel
            packager: target/release/fmd-packager
            gpg: gpg
          - target: macos-arm64
            runner: macos-15
            packager: target/release/fmd-packager
            gpg: gpg
          - target: linux-x64
            runner: ubuntu-24.04
            packager: target/release/fmd-packager
            gpg: gpg
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            packager: target/release/fmd-packager
            gpg: gpg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Require signature verifier
        shell: pwsh
        run: '& "${{ matrix.gpg }}" --version'
      - name: Build packager
        run: cargo build --locked --release -p fmd-packager
      - name: Assemble and smoke-test video-core
        shell: pwsh
        run: >-
          node scripts/packs/assemble-video-core.mjs
          --target "${{ matrix.target }}"
          --work "${{ runner.temp }}/video-core-work"
          --out "${{ runner.temp }}/video-core-${{ matrix.target }}.zip"
          --packager "${{ matrix.packager }}"
          --gpg "${{ matrix.gpg }}"
      - name: Upload unsigned CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-video-core-${{ matrix.target }}
          path: ${{ runner.temp }}/video-core-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7
