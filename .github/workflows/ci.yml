name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      run_packs: ${{ steps.filter.outputs.run_packs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - id: filter
        name: Detect engine-pack changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_packs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pattern='^(\.github/workflows/(ci|engine-packs)\.yml|Cargo\.(lock|toml)|crates/(fmd-core|fmd-packager)/|packs/|scripts/packs/|scripts/validate-release-inputs\.mjs)'
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq "$pattern"; then
            echo "run_packs=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_packs=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: node scripts/check-locales.mjs
      - run: node scripts/validate-release-inputs.mjs

  metadata:
    runs-on: ubuntu-24.04
    env:
      FORBIDDEN_METADATA_REGEX: ${{ vars.FORBIDDEN_METADATA_REGEX }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate pull request title and body
        if: github.event_name == 'pull_request'
        run: node scripts/check-pull-request-metadata.mjs

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
          - target: windows-arm64
            runner: windows-11-arm
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  engine-packs:
    needs: changes
    uses: ./.github/workflows/engine-packs.yml
    with:
      run_packs: ${{ needs.changes.outputs.run_packs == 'true' }}

  ci-required:
    if: always()
    needs: [frontend, rust, metadata, engine-packs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all selected checks
        env:
          FRONTEND: ${{ needs.frontend.result }}
          RUST: ${{ needs.rust.result }}
          METADATA: ${{ needs.metadata.result }}
          ENGINE_PACKS: ${{ needs.engine-packs.result }}
        run: |
          for result in "$FRONTEND" "$RUST" "$METADATA" "$ENGINE_PACKS"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI check finished with: $result"
              exit 1
            fi
          done
